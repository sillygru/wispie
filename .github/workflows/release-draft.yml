name: Release Draft

# Push a tag matching v*release to auto-create a private draft release
# with all platform binaries attached in a fixed order. Edit notes/assets
# in the UI, then Publish when ready. Source archives are appended last
# automatically by GitHub.
#
# Usage:
#   git tag v1.4.4-release && git push origin v1.4.4-release
#
# Pushing the tag points at a commit that ci-builds.yml already built, so the
# gate job reuses that run's artifacts instead of compiling everything again.
# It only builds when no complete, unexpired artifact set exists for the
# tagged commit (e.g. an old commit, a commit whose path filters skipped the
# CI run, or a failed CI run).

on:
  push:
    tags:
      - 'v*release'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)draft (e.g. v1.4.4-release)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  gate:
    name: Find reusable build
    runs-on: ubuntu-latest
    outputs:
      build_run_id: ${{ steps.find.outputs.run_id }}
      build_run_url: ${{ steps.find.outputs.run_url }}
    steps:
      - name: Look for a successful CI build of the tagged commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -uo pipefail

          expected="
          wispie-armeabi-v7a-release
          wispie-arm64-v8a-release
          wispie-linux-x86_64-appimage-zip
          wispie-macos-arm64-zip
          wispie-macos-x64-zip
          wispie-windows-x64-portable-zip
          wispie-windows-x64-setup-zip
          "
          ref="${INPUT_TAG:-${GITHUB_REF}}"
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${ref}" --jq .sha) || {
            echo "::error::Could not resolve ${ref} to a commit"
            exit 1
          }
          echo "Tagged commit: ${sha}"

          run_id=$(gh run list --repo "${GITHUB_REPOSITORY}" \
            --workflow ci-builds.yml --commit "${sha}" \
            --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty' || true)

          if [ -z "${run_id}" ]; then
            echo "::notice::No successful ci-builds.yml run for ${sha}; building."
          else
            have=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | .name')
            usable="${run_id}"
            for artifact in $(printf '%s' "${expected}" | tr -s '[:space:]' ' '); do
              if ! printf '%s\n' "${have}" | grep -qx -- "${artifact}"; then
                echo "::notice::Run ${run_id} is missing ${artifact}; building."
                usable=""
                break
              fi
            done
            run_id="${usable}"
          fi

          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          if [ -n "${run_id}" ]; then
            echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              >> "${GITHUB_OUTPUT}"
            echo "::notice::Reusing artifacts from run ${run_id}"
          fi

  build:
    name: Build binaries
    needs: gate
    if: needs.gate.outputs.build_run_id == ''
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
      retention-days: 1

  create-draft:
    needs: [gate, build]
    # `build` is skipped when the gate found reusable artifacts; a failed build
    # must fail the release rather than fall through to an incomplete draft.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          # Empty means "this run"; the gate sets it when reusing a CI run.
          run-id: ${{ needs.gate.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify staged files
        run: |
          ls -l dist
          for f in \
            wispie-arm64-v8a-release.apk \
            wispie-armeabi-v7a-release.apk \
            wispie-linux-x86_64.AppImage.zip \
            wispie-macos-arm64.zip \
            wispie-macos-x64.zip \
            wispie-windows-x64-portable.zip \
            wispie-windows-x64-setup.zip; do
            test -f "dist/$f" || (echo "::error::Missing dist/$f" && exit 1)
          done

      - name: Create draft release with ordered assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body: "Draft auto-created from tag ${{ github.event.inputs.tag || github.ref_name }} — edit before publishing."
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/wispie-arm64-v8a-release.apk
            dist/wispie-armeabi-v7a-release.apk
            dist/wispie-linux-x86_64.AppImage.zip
            dist/wispie-macos-arm64.zip
            dist/wispie-macos-x64.zip
            dist/wispie-windows-x64-portable.zip
            dist/wispie-windows-x64-setup.zip
