name: Desktop Builds

# Linux (x86_64 AppImage), Windows (x86_64 installer + portable zip) and macOS
# (separate arm64 / x64 zips, NOT universal — thinned from one universal build).
# Binaries ship unsigned: on macOS right-click > Open on first launch.
# Windows/Linux runtime notes: install a system ffmpeg for lyrics/covers and
# (Linux) xdg-desktop-portal + backend for the native folder picker
# (file_picker 10.x uses the XDG portal, not zenity/kdialog).

on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'linux/**'
      - 'windows/**'
      - 'macos/**'
      - 'packaging/**'
      - 'assets/app_icon.png'
      - 'pubspec.yaml'
      - '.github/workflows/desktop-builds.yml'
  workflow_dispatch:

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            appstream desktop-file-utils

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.47.2"
          cache: true

      - name: Clear stale pub.dev credentials
        run: |
          rm -f "$HOME/.pub-cache/credentials.json"
          rm -f "$HOME/.config/dart/pub-credentials.json" "$HOME/.config/dart/pub-tokens.json"
          dart pub token remove --all || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release bundle (x64)
        run: flutter build linux --release

      - name: Download appimagetool
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Build AppImage
        # The script's executable bit is not always preserved by checkout, and
        # appimagetool (itself an AppImage) needs FUSE, which runners lack.
        run: |
          chmod +x ./packaging/linux/make_appimage.sh ./packaging/linux/AppRun
          APPIMAGE_EXTRACT_AND_RUN=1 ./packaging/linux/make_appimage.sh build/linux/x64/release/bundle Wispie-linux-x86_64.AppImage ./appimagetool
          chmod +x Wispie-linux-x86_64.AppImage
          ls -l Wispie-linux-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Wispie-linux-x86_64.AppImage
          path: Wispie-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.47.2"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release (x64)
        run: flutter build windows --release

      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath Wispie-windows-x64-portable.zip -Force

      - name: Read version from pubspec
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$' |
            Select-Object -First 1
          $ver = $line.Matches.Groups[1].Value.Trim() -replace '\+.*$',''
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = '1.0.0' }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            windows\packaging\wispie.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: wispie-windows-x64-setup
          path: build/windows-installer/Wispie-Setup-x64.exe
          retention-days: 14

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: wispie-windows-x64-portable
          path: Wispie-windows-x64-portable.zip
          retention-days: 14

  macos:
    # One universal build on Apple Silicon, then lipo-thin into separate
    # single-arch apps (no Intel runners needed, no universal artifact).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.47.2"
          cache: true
          architecture: arm64

      - name: Log toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Select Xcode 16.2 (newest on macos-14 image)
        # Newer toolchain, fewer surprises than the default 15.4.
        # (Does NOT fix video_player_avfoundation's bare `#if TARGET_OS_OSX`
        # — proven identical failure on 16.2; Fallback A handles that.)
        # Verified present on image 20260831.
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Clear stale pub.dev credentials
        run: |
          rm -f "$HOME/.pub-cache/credentials.json"
          rm -f "$HOME/.config/dart/pub-credentials.json" "$HOME/.config/dart/pub-tokens.json"
          dart pub token remove --all || true

      - name: Purge stale SwiftPM/Xcode caches (CI-only)
        # Fresh runners can carry a partial SPM artifact cache which makes
        # xcodebuild fail with "<url> already exists in file system" +
        # fatalError (e.g. ffmpeg_kit libswscale zip). Local checkouts are
        # untouched; this only clears the ephemeral runner's HOME caches.
        run: |
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf build/macos macos/build

      - name: Assert CocoaPods fully deintegrated
        # All macos plugins are Swift Packages; leftover CocoaPods
        # integration breaks the build with "module 'Flutter' not found".
        run: |
          test ! -e macos/Podfile || (echo "macos/Podfile still present" && exit 1)
          ! grep -r "Pods/" macos/Flutter/*.xcconfig macos/Runner.xcworkspace/contents.xcworkspacedata || \
            (echo "Pods references remain in macos config" && exit 1)

      - name: Install dependencies
        run: |
          flutter pub get
          flutter precache --macos

      - name: Build macOS release (universal)
        id: build-attempt-1
        continue-on-error: true
        run: |
          set -o pipefail
          bash packaging/macos/prepare_spm_artifacts.sh
          if flutter build macos --release; then
            exit 0
          fi
          echo "::warning::SPM build failed, purging caches and retrying once"
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf build/macos macos/build
          flutter clean
          flutter pub get
          flutter precache --macos
          bash packaging/macos/prepare_spm_artifacts.sh
          flutter build macos --release

      - name: Fallback A - patch video_player_avfoundation headers and rebuild
        id: build-attempt-2
        continue-on-error: true
        if: steps.build-attempt-1.outcome == 'failure'
        # Makes the build toolchain-independent: 10 files under the plugin's
        # darwin/ tree use bare `#if TARGET_OS_OSX` with no TargetConditionals
        # import. Idempotent and version-globbed, so lock bumps can't silently
        # disable it. Applied to PUB-CACHE (outside the repo), so it survives
        # `flutter clean` and never touches the checkout.
        run: |
          echo "::warning::Attempt 1 failed, patching video_player_avfoundation headers"
          python3 - <<'PYEOF'
          import glob
          import os
          pattern = os.path.join(
              os.environ["HOME"],
              ".pub-cache/hosted/pub.dev/video_player_avfoundation-*/darwin"
              "/video_player_avfoundation/Sources/video_player_avfoundation_objc",
          )
          files = []
          for base in glob.glob(pattern):
              files += glob.glob(os.path.join(base, "include/video_player_avfoundation_objc/*.h"))
              files += glob.glob(os.path.join(base, "*.m"))
          if not files:
              raise SystemExit("No video_player_avfoundation darwin sources found in pub-cache")
          patched = 0
          for f in sorted(files):
              with open(f) as fh:
                  src = fh.read()
              if "TargetConditionals" in src or "TARGET_OS_OSX" not in src:
                  continue
              with open(f, "w") as fh:
                  fh.write("#import <TargetConditionals.h>\n" + src)
              patched += 1
              print("patched " + f)
          print("patched %d of %d files" % (patched, len(files)))
          PYEOF
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf build/macos macos/build
          flutter clean
          flutter pub get
          flutter precache --macos
          bash packaging/macos/prepare_spm_artifacts.sh
          flutter build macos --release

      - name: Fallback B - stock Xcode 15.4 and rebuild
        id: build-attempt-3
        continue-on-error: true
        if: steps.build-attempt-1.outcome == 'failure' && steps.build-attempt-2.outcome == 'failure'
        # Covers an Xcode 16.2-specific incompatibility with Flutter 3.47.2.
        # The Fallback A header patch persists in PUB-CACHE, so the known
        # TARGET_OS_OSX defect stays fixed under this toolchain too.
        run: |
          echo "::warning::Attempts 1-2 failed, falling back to stock Xcode 15.4"
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version
          rm -rf build/macos macos/build
          flutter clean
          flutter pub get
          flutter precache --macos
          bash packaging/macos/prepare_spm_artifacts.sh
          flutter build macos --release

      - name: Fail if all macOS build attempts failed
        if: steps.build-attempt-1.outcome == 'failure' && steps.build-attempt-2.outcome == 'failure' && steps.build-attempt-3.outcome == 'failure'
        run: |
          echo "::error::All macOS build attempts failed (Xcode 16.2 SPM, 16.2 + header patch, 15.4 + header patch). See above logs."
          exit 1

      - name: Assert file-picker entitlement is embedded
        # file_picker hard-requires user-selected.read* even with the sandbox
        # off; without it getDirectoryPath throws ENTITLEMENT_NOT_FOUND.
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          codesign -d --entitlements - "$APP" | grep -q "user-selected" || \
            (echo "Missing user-selected entitlement in $APP" && exit 1)

      - name: Thin into single-arch apps and zip
        run: |
          chmod +x packaging/macos/thin_macos_app.sh
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          echo "Thinning $APP"
          ./packaging/macos/thin_macos_app.sh "$APP" arm64 build/Wispie-arm64.app
          ./packaging/macos/thin_macos_app.sh "$APP" x86_64 build/Wispie-x64.app
          cd build
          ditto -c -k --sequesterRsrc --keepParent Wispie-arm64.app Wispie-macos-arm64.zip
          ditto -c -k --sequesterRsrc --keepParent Wispie-x64.app Wispie-macos-x64.zip
          cd ..

      - name: Upload macOS arm64 zip
        uses: actions/upload-artifact@v4
        with:
          name: wispie-macos-arm64
          path: build/Wispie-macos-arm64.zip
          retention-days: 14

      - name: Upload macOS x64 zip
        uses: actions/upload-artifact@v4
        with:
          name: wispie-macos-x64
          path: build/Wispie-macos-x64.zip
          retention-days: 14
