name: Server Vet

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - '.github/workflows/server_tests.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'server/**'
      - '.github/workflows/server_tests.yml'

jobs:
  vet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
