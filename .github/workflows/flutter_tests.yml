name: Flutter Analyze

on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter_tests.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter_tests.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true
      - name: Clear stale pub.dev credentials
        run: |
          rm -f "$HOME/.pub-cache/credentials.json"
          rm -f "$HOME/.config/dart/pub-credentials.json" "$HOME/.config/dart/pub-tokens.json"
          dart pub token remove --all || true

      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --set-exit-if-changed .
      - name: Analyze project
        run: flutter analyze
