name: wispie
description: "A feature packed local music player."
publish_to: "none"
version: 1.4.0-release+18

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.16
  audio_session: ^0.2.2
  rxdart: ^0.28.0
  flutter_riverpod: ^3.1.0
  equatable: ^2.0.8
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  uuid: ^4.3.3
  file_picker: ^10.3.8
  crypto: ^3.0.7
  path: ^1.9.1
  sqflite: ^2.3.0
  audio_metadata_reader: ^1.4.2
  permission_handler: ^11.1.0
  archive: ^3.6.1
  share_plus: ^10.1.4
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.1
  image: ^4.3.0
  ffmpeg_kit_flutter_new_min: ^3.1.0
  video_player: ^2.9.2
  wakelock_plus: ^1.3.3
  hugeicons: ^1.1.7
  http: ^1.2.1
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  sqflite_common_ffi: ^2.3.0
  sqlite3: ^2.4.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  path_provider_platform_interface: ^2.1.2
  build_runner: ^2.4.9
  shared_preferences_platform_interface: ^2.3.2
  package_info_plus_platform_interface: ^3.0.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#121212"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

dependency_overrides:
  # Vendored: upstream sets no notification category and claims no
  # media-button routing, so strict OEM surfaces (EMUI Control Centre)
  # never list the app. Patches AudioService.java: CATEGORY_TRANSPORT on
  # the notification plus FLAG_HANDLES_MEDIA_BUTTONS on the session.
  audio_service:
    path: third_party/audio_service
  # Vendored without linux/: upstream Linux support is x86_64-only and
  # fatal-errors on aarch64. Features degrade gracefully (see FFmpegService).
  ffmpeg_kit_flutter_new_min:
    path: third_party/ffmpeg_kit_flutter_new_min
  # Vendored: upstream concatenatingInsertAll moves from an out-of-bounds
  # index, so inserted songs land at the playlist end and mid-queue playback
  # desyncs on media_kit (Linux/Windows).
  just_audio_media_kit:
    path: third_party/just_audio_media_kit
