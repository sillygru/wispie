name: wispie
description: "A feature packed local music player."
publish_to: "none"
version: 2.4.0-release+49

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.16
  audio_session: ^0.2.2
  rxdart: ^0.28.0
  flutter_riverpod: ^3.1.0
  equatable: ^2.0.8
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  uuid: ^4.3.3
  file_picker: ^12.3.0
  crypto: ^3.0.7
  path: ^1.9.1
  sqflite: ^2.3.0
  audio_metadata_reader: ^1.4.2
  permission_handler: ^13.0.2
  archive: ^4.2.0
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1
  image: ^4.3.0
  ffmpeg_kit_flutter_new_min: ^3.1.0
  video_player: ^2.9.2
  wakelock_plus: ^1.3.3
  hugeicons: ^1.1.7
  http: ^1.2.1
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  sqflite_common_ffi: ^2.3.0
  sqlite3: ^3.5.2
  window_manager: ^0.5.2
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  unorm_dart: ^0.3.3
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.9

# App icons are generated by tool/gen_icons.py, not flutter_launcher_icons.

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/icons/new/
    - assets/icons/classic/

dependency_overrides:
  # Vendored: upstream sets no notification category, delays media session
  # activation, omits early sessionActivity, and misses media-button receiver
  # binding. Patches AudioService.java: CATEGORY_TRANSPORT, immediate active
  # session state, sessionActivity in configure, and explicit media button receiver.
  audio_service:
    path: third_party/audio_service
  # Vendored without linux/: upstream Linux support is x86_64-only and
  # fatal-errors on aarch64. Features degrade gracefully (see FFmpegService).
  ffmpeg_kit_flutter_new_min:
    path: third_party/ffmpeg_kit_flutter_new_min
  # Vendored: upstream concatenatingInsertAll moves from an out-of-bounds
  # index, so inserted songs land at the playlist end and mid-queue playback
  # desyncs on media_kit (Linux/Windows).
  just_audio_media_kit:
    path: third_party/just_audio_media_kit
  # Vendored: upstream eager-instantiates Geolocator in the Windows plugin
  # constructor on startup, falsely triggering Windows location service usage
  # in the taskbar even though the app never uses location. Lazily creates
  # Geolocator only if location service status is explicitly queried.
  permission_handler_windows:
    path: third_party/permission_handler_windows
