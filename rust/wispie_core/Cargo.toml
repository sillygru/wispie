[package]
name = "wispie_core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native library scan, tag reading and cover cache for Wispie"

[lib]
name = "wispie_core"
# staticlib feeds the Apple targets (linked into Runner), cdylib feeds
# Android/Linux/Windows where the library is bundled next to the app.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.2"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
] }
libjpeg-turbo-rs = { version = "0.9", default-features = false, features = ["std"] }
lofty = "0.25"
rayon = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
symphonia = { version = "0.6", default-features = false, features = [
    "aac",
    "adpcm",
    "aiff",
    "alac",
    "flac",
    "isomp4",
    "mkv",
    "mpa",
    "ogg",
    "opt-simd",
    "pcm",
    "vorbis",
    "wav",
] }
symphonia-opus = "0.1"
unicode-normalization = "0.1"
walkdir = "2"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
